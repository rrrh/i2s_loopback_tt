--- 
# TinyTapeout project information
yaml_version: 6

project:
  title:        "I2S Digital Loopback"
  author:       "Sven Huerlimann"
  slack_handle: ""
  description:  "A 24-bit I2S receiver and transmitter loopback dummy"
  language:     "Verilog"
  clock_hz:     3072000       # e.g., 3.072 MHz for 48 kHz stereo audio at 64 bits/frame

  # How many tiles your design occupies? A 1x1 tile is plenty for shift registers.
  tiles: "1x1"          

  # Your top module name MUST start with tt_um_
  top_module:  "tt_um_i2s_loopback"
  
  # List all your source files here. The wrapper MUST be first.
  source_files:  
    - "tt_um_i2s_loopback.v"
    - "i2s_core.v"
    - "i2s_rx.v"
    - "i2s_tx.v"

# The pinout mapping for your project's datasheet
pinout:
