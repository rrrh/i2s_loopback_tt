  ui[0]: "ws (Word Select)"
  ui[1]: "rx_sdata (Serial Data In)"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Standard Outputs
  uo[0]: "tx_sdata (Serial Data Out)"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (unused in this design)
